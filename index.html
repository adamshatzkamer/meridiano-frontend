<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Puts the theme class on <html> before any stylesheet paints, so a dark reader never sees a light frame.
         ThemeProvider's layout effect runs only after React mounts, which is one bundle download too late.
         Stays first in <head>: an inline script after a stylesheet link waits for that link to load.
         Reads the same key and values as THEME_STORAGE_KEY in src/contexts/ThemeContext.tsx; the
         "reads the same storage key as ThemeContext" case in src/theme-first-paint.test.ts guards the pair. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme-preference');
        } catch (error) {
          // Safari in private mode throws here. Fall through to the system preference.
        }

        var dark = stored === 'dark';
        if (!dark && stored !== 'light') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (error) {
            dark = false;
          }
        }

        if (dark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <title>Meridiano</title>
    <meta name="description" content="AI-powered news briefings and insights from curated news feeds." />
    <meta name="author" content="Meridiano" />

    <meta property="og:title" content="Meridiano" />
    <meta property="og:description" content="AI-powered news briefings and insights from curated news feeds." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meridiano — AI-powered news briefings and insights" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meridiano" />
    <meta name="twitter:description" content="AI-powered news briefings and insights from curated news feeds." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Playfair starts at 600 since every font-serif heading is semibold or heavier (prose h1 is 800).
         Inter 700 and JetBrains Mono 600 are left out on purpose: font-bold Inter text falls back to the 600 face
         and prose inline code to the 500 face, and requesting them would change how that text looks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
